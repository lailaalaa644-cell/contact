name: contact_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8
  lottie: ^3.8.2
  flutter_svg: ^2.3.3
  image_picker: ^1.2.4

dev_dependencies:
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/core/gen/ 
  
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

flutter:


  uses-material-design: true

  assets:
    - assets/imgs/
    - assets/lottie/
    - assets/icons/

    # - images/a_dot_ham.jpeg




flutter_native_splash:
  color: "#29384D"
  image: assets/imgs/image.png

  android_12:
    image: assets/imgs/image.png
    icon_background_color: "#29384D"


  web: false
